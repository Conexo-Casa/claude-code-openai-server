[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-code-interface"
version = "0.1.0"
description = "OpenAI-compatible HTTP server wrapping the Claude Code CLI (stream-json), for use as a local provider from hermes and other OpenAI clients."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # uvloop + httptools come in via uvicorn[standard], but are pinned
    # explicitly so the fast event loop / HTTP parser are guaranteed present
    # and run() can request them by name (see app/main.run).
    "uvloop>=0.19; sys_platform != 'win32'",
    "httptools>=0.6",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Upper bound is load-bearing: mcp 2.0 removes the low-level decorator API
    # this server is built on -- `@server.list_tools()` and
    # `@server.call_tool(validate_input=False)` in app/mcp_bridge.py. An
    # unbounded `mcp>=1.2` lets a fresh `uv sync` resolve to 2.x and fail at
    # import, which for a systemd unit means the service simply stops starting.
    "mcp>=1.2,<2",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "anyio>=4.4",
]

[project.scripts]
claude-code-interface = "app.main:run"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
